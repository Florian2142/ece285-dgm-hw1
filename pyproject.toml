[project]
name = "dgm"
version = "0.1.0"
description = "ECE 285 Deep Generative Models (UC San Diego, Fall 2026): homeworks, project, and notes."
readme = "README.md"
authors = [{ name = "Florian Saewert" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.2",
    "omegaconf>=2.3",
    "pillow>=11.0",
    "pytorch-ignite>=0.5.5",
    "scipy>=1.15",
    "tensorboard>=2.18",
    "torch>=2.14",
    "torchvision>=0.29",
    "tqdm>=4.67",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbstripout>=0.8",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Editable install puts these folders on sys.path, so `import dgm` (shared library),
# and `import hw1` (homeworks/hw1) work from anywhere.
dev-mode-dirs = ["src", "homeworks"]

[tool.hatch.build.targets.wheel]
packages = ["src/dgm"]

# CUDA 13.0 builds of PyTorch on Windows/Linux (RTX 4080 laptop, driver 610). macOS uses PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
ignore = [
    "E501",   # long lines: the formatter handles code; long strings/comments are fine
    "RUF001", # ambiguous unicode in strings (we use ×, →, θ, φ in messages)
    "RUF002", # ... in docstrings
    "RUF003", # ... in comments
]

[tool.ruff.lint.isort]
known-first-party = ["dgm", "hw1", "hw2", "hw3", "ot_toy"]

[tool.pytest.ini_options]
testpaths = ["tests", "homeworks"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
markers = [
    "slow: downloads Inception weights or trains for a while (skip with -m 'not slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning:ignite.*",
]
