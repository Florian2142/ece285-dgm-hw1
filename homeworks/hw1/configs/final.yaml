# Configuration of x-width64, the model illustrated in the report (seed 0).
# The notebook is the source for the reported runs and fitted-prior evaluation.
# The CLI trains the same configuration, but its RNG consumption differs.
name: x-width64-seed0

data:
  image_size: 64
  batch_size: 128

model:
  latent_dim: 128
  hidden_channels: 64
  num_stages: 3
  convs_per_stage: 1
  norm: batch
  activation: silu
  downsample: stride
  upsample: nearest_conv
  final_conv: false
  residual: false
  dropout: 0.0
  likelihood: gaussian
  gaussian_sigma: 0.1

train:
  epochs: 200
  lr: 1.0e-3
  lr_schedule: cosine
  weight_decay: 0.0
  augment: false
  beta: 0.03
  kl_warmup_epochs: 0
  grad_clip_norm: 1.0
  seed: 0
  sample_every: 10

eval:
  checkpoint: best
  reference_split: test
  num_samples: 0 # 0 = all 624 test images
  repeats: 3
